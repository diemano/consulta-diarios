name: Rodar monitor diário (09h e 17h BRT)

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 BRT (UTC-3) -> 12:00 UTC
    - cron: "0 20 * * *"   # 17:00 BRT (UTC-3) -> 20:00 UTC
  workflow_dispatch:       # permite rodar manualmente

jobs:
  hit-function:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL || 'https://consultadiarios.netlify.app' }}
    steps:
      - name: Disparar função check-doepb (todas as fontes)
        run: |
          set -euo pipefail
          echo "Disparando: $SITE_URL/.netlify/functions/check-doepb"
          curl -fsS --retry 3 --retry-delay 30 --max-time 300 \
            "$SITE_URL/.netlify/functions/check-doepb?snippets=1"
