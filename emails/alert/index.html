<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0;background:#f0f2f5;">
  <table width="100%" cellpadding="0" cellspacing="0" style="max-width:640px;margin:24px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
    <!-- Cabeçalho -->
    <tr>
      <td style="background:#4f46e5;padding:24px 28px;">
        <table cellpadding="0" cellspacing="0"><tr>
          <td style="width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:10px;text-align:center;font-size:20px;color:#fff;font-weight:800;">D</td>
          <td style="padding-left:12px;color:#fff;font-size:18px;font-weight:700;">Monitor de Diários</td>
        </tr></table>
      </td>
    </tr>
    <!-- Corpo -->
    <tr>
      <td style="padding:28px;">
        <h1 style="margin:0 0 8px;font-size:22px;color:#1f2937;">✅ Termos encontrados</h1>
        <p style="margin:0 0 16px;color:#6b7280;font-size:15px;">
          <strong>{{source}}</strong> — Edição de <strong>{{edition}}</strong>
        </p>

        <!-- Resumo -->
        <table cellpadding="0" cellspacing="0" style="width:100%;background:#eef2ff;border-radius:12px;margin-bottom:20px;">
          <tr><td style="padding:16px 20px;">
            <p style="margin:0 0 6px;font-size:14px;color:#4338ca;font-weight:600;">📊 Resumo da busca</p>
            <p style="margin:0;font-size:15px;color:#1f2937;">
              {{countResumo}}
            </p>
          </td></tr>
        </table>

        <!-- Incidências -->
        {{#if snippets}}
          <p style="margin:0 0 10px;font-size:14px;color:#6b7280;font-weight:600;">📝 Trechos encontrados:</p>
          {{snippets}}
        {{/if}}

        <!-- Link -->
        <a href="{{pdfUrl}}" target="_blank" rel="noopener" style="display:inline-block;margin-top:20px;padding:12px 24px;background:#4f46e5;color:#fff;text-decoration:none;border-radius:10px;font-weight:600;font-size:15px;">📄 Abrir PDF da edição</a>
      </td>
    </tr>
    <!-- Rodapé -->
    <tr>
      <td style="padding:16px 28px;background:#f9fafb;border-top:1px solid #e5e7eb;color:#9ca3af;font-size:12px;">
        Grupo: <strong style="color:#6b7280;">{{groupName}}</strong> · Monitor de Diários · {{dateNow}}
      </td>
    </tr>
  </table>
</body>
</html>
